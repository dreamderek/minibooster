<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>MetaMath 作答頁</title>
    <script src="./JS/math-show.js"></script>
    <script src="./JS/frame-panel.js"></script>
    <script src="./JS/main.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
           
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true"></div>
                <div class="brand-copy">
                    <div class="brand-title">MetaMath</div>
                    <div class="brand-sub">數學選擇題</div>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" type="button" data-go="0">作答</button>
                <button class="tab" type="button" data-go="1">檢討</button>
            </div>
        </header>

        <main class="viewport">
            <div class="pages" id="pages">
                <section class="page task-page" aria-label="作答區">
                    <frame-panel data-theme="question" title="鑑定試題">
                        <div class="panel-scroll">
                            <div class="panel-pad" id="questionHost"></div>
                        </div>
                    </frame-panel>

                    <frame-panel data-theme="options" title="5 選項 可複選">
                        <div class="panel-scroll">
                            <div class="panel-pad">
                                <div class="choice-list" id="choices"></div>
                            </div>
                        </div>
                    </frame-panel>

                    <div class="action-bar">
                        <button class="btn" id="submitBtn" type="button">答案送出</button>
                    </div>
                </section>

                <section class="page review-page" aria-label="檢討區">
                    <frame-panel data-theme="review" title="批改檢定">
                        <div class="panel-scroll">
                            <div class="panel-pad">
                                <div class="analysis">
                                    <div class="analysis-card">
                                        <h3>作答結果</h3>
                                        <div class="review-list" id="reviewList"></div>
                                    </div>

                                    <div class="analysis-card">
                                        <h3>評鑑</h3>
                                        <p id="feedbackText"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </frame-panel>
                </section>
            </div>
        </main>
    </div>

</body>

</html>
