<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>MetaMath 作答頁</title>
    <script src="./JS/math-show.js"></script>
    <script src="./JS/frame-panel.js"></script>
    <script src="./JS/main.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />

</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <img class="brand-logo" src="./assets/logo.png" alt="MetaMath Logo" />
            </div>

            <div class="page-indicator">
                <img id="pageIndicator" src="./assets/minitask.png" alt="" />
            </div>
        </header>

        <main class="viewport">
            <div class="pages" id="pages">
                <section class="page task-page" aria-label="作答區">
                    <frame-panel data-theme="question" title="鑑定試題">
                        <div class="panel-scroll">
                            <div class="panel-pad" id="questionHost"></div>
                        </div>
                    </frame-panel>

                    <frame-panel data-theme="options" title="5 選項 可複選">
                        <div class="panel-scroll">
                            <div class="panel-pad">
                                <div class="choice-list" id="choices"></div>
                            </div>
                        </div>
                    </frame-panel>

                    <div class="action-bar">
                        <button class="btn" id="submitBtn" type="button">答案送出</button>
                    </div>
                </section>

                <section class="page review-page" aria-label="檢討區">
                    <frame-panel data-theme="review" title="批改檢定">
                        <div class="panel-scroll">
                            <div class="panel-pad">
                                <div class="analysis">
                                    <div class="analysis-card">
                                        <h3>作答結果 <span style="font-size: 0.7em;color:orange;">點選項看詳解</span></h3>
                                        <div class="review-list" id="reviewList"></div>
                                    </div>

                                    <div class="analysis-card">
                                        <h3>評價</h3>
                                        <p id="feedbackText"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </frame-panel>
                </section>

                <section class="page ad-page" aria-label="廣告區">
                    <div class="ad-action-row">
                        <button class="btn btn-next" id="nextQuestionBtn" type="button">再來一題</button>
                    </div>

                    <frame-panel data-theme="ad">
                        <div class="panel-scroll">
                            <div class="ad-card">
                                <img class="ad-image" src="./assets/廣告圖.png" alt="預設廣告圖檔" />
                            </div>
                        </div>
                    </frame-panel>
                    <div class="ad-midle">
                        <a id="adLink" href="https://example.com" target="_blank" rel="noopener noreferrer"
                            aria-label="前往廣告頁">
                            <img class="ad-button" src="./assets/廣告圖按鈕.png" alt="預設廣告圖檔" />
                        </a>
                    </div>
                </section>
            </div>
        </main>
    </div>

</body>

</html>
